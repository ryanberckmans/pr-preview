# Deletes a pull request's branch once the pull request closes, merged or not,
# including pull requests landed by pushing their commits to the base branch.
# The pull request keeps a Restore branch button. A branch is kept if it got new
# commits after the close or another open pull request comes from it. Open pull
# requests based on a merged branch move to the branch it was merged into; a
# branch that was closed without merging is kept while any are based on it.
#
# pull_request_target, because GitHub runs no pull_request workflow for a pull
# request with merge conflicts, as abandoned and superseded ones often have. It
# runs this file from the default branch, and the job runs no pull request code.
name: Delete closed branch

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] the job runs no pull request code
    types: [closed]

permissions: {}

jobs:
  delete:
    name: Delete the closed pull request's branch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # to delete the branch
      pull-requests: write # to move pull requests based on it
    steps:
      - name: Delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
          CLOSED_SHA: ${{ github.event.pull_request.head.sha }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          ref="heads/$(jq -rn --arg b "$BRANCH" '$b | split("/") | map(@uri) | join("/")')"
          if ! sha=$(gh api "repos/$REPO/git/ref/$ref" --jq .object.sha 2>/dev/null); then
            echo "$BRANCH is already deleted."
            exit 0
          fi
          if [ "$sha" != "$CLOSED_SHA" ]; then
            echo "::notice::Kept $BRANCH: it has commits from after the pull request closed."
            exit 0
          fi
          if [ "$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq length)" != 0 ]; then
            echo "::notice::Kept $BRANCH: another open pull request comes from it."
            exit 0
          fi
          based=$(gh pr list --repo "$REPO" --base "$BRANCH" --state open --limit 100 --json number --jq '.[].number')
          # Moving them onto the base would add this branch's unmerged commits to them.
          if [ "$MERGED" != true ] && [ -n "$based" ]; then
            echo "::notice::Kept $BRANCH: it wasn't merged and open pull requests are based on it."
            exit 0
          fi
          # GitHub closes open pull requests whose base branch is deleted, so first
          # move them onto the branch this one was merged into, as GitHub's own
          # branch deletion does.
          for number in $based; do
            gh api --method PATCH "repos/$REPO/pulls/$number" -f base="$BASE" --silent
            echo "Moved #$number onto $BASE."
          done
          gh api --method DELETE "repos/$REPO/git/refs/$ref" --silent
          echo "Deleted $BRANCH."
