# Reusable workflow: builds the calling repo and uploads it to Cloudflare Workers
# as a preview with its own link, then comments the link on the PR. When the PR
# closes, its preview is deleted. While the repo is private the link only opens
# after Cloudflare Access sign-in, and nothing is uploaded unless that is proven
# first. See README.md for setup.
#
# Two jobs keep the Cloudflare token away from the repo's code:
#   build   - runs the repo's install, build and check, with no Cloudflare token.
#             A closed PR skips it, since there is nothing to build.
#   publish - runs only pr-preview's own code. It uploads the build output with
#             pr-preview's pinned Wrangler, or deletes a closed PR's preview,
#             then posts or updates the PR comment. workerd, which Wrangler
#             could use to run the build's code locally, is turned off.
name: pr-preview

on:
  workflow_call:
    inputs:
      worker-name:
        description: Cloudflare Worker that holds this repo's previews. Lowercase letters, digits and dashes. Public repos use "<worker-name>-public".
        type: string
        required: true
      wrangler-config:
        description: Wrangler JSON config that build-command writes, relative to working-directory. For the Cloudflare Vite plugin, dist/<worker>/wrangler.json.
        type: string
        required: true
      access-team-domain:
        description: Your Cloudflare Access team domain (<team>.cloudflareaccess.com). When set, private previews must redirect to exactly this host.
        type: string
        required: false
        default: ''
      install-command:
        description: Installs dependencies.
        type: string
        required: false
        default: npm ci
      build-command:
        description: Builds the Worker and writes wrangler-config.
        type: string
        required: false
        default: npm run build
      check-command:
        description: Optional command run after the build. Its result goes in the PR comment and never blocks the preview.
        type: string
        required: false
        default: ''
      check-timeout-minutes:
        description: Time limit for check-command. A check that runs out of time counts as failed.
        type: number
        required: false
        default: 10
      node-version:
        description: Node.js version for install, build and check.
        type: string
        required: false
        default: '22'
      working-directory:
        description: Folder of the app inside the repo.
        type: string
        required: false
        default: '.'
      d1:
        description: 'JSON mapping each D1 binding to its preview database, such as {"DB":{"database_name":"my-app-preview","migrations_dir":"migrations"}}. Databases are created when missing.'
        type: string
        required: false
        default: '{}'
      preview-vars:
        description: JSON object of the only plain-text variables previews get.
        type: string
        required: false
        default: '{}'
      force-private:
        description: Keep previews private even when the repo is public.
        type: boolean
        required: false
        default: false
      runs-on:
        description: Runner for the jobs.
        type: string
        required: false
        default: ubuntu-24.04
      timeout-minutes:
        description: Time limit for the build job.
        type: number
        required: false
        default: 20
    secrets:
      CLOUDFLARE_API_TOKEN:
        description: Cloudflare API token with Account · Workers Scripts · Edit and Account · D1 · Edit.
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        description: Cloudflare account ID.
        required: false
    outputs:
      url:
        description: The preview link.
        value: ${{ jobs.publish.outputs.url }}
      deployment-id:
        description: The new deployment of the preview.
        value: ${{ jobs.publish.outputs.deployment-id }}
      visibility:
        description: private or public.
        value: ${{ jobs.publish.outputs.visibility || jobs.build.outputs.visibility }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    # Fork and Dependabot pull requests get no preview, since pull_request gives
    # them no secrets. A closed pull request has nothing to build: the publish
    # job deletes its preview on its own. pull_request_target runs never build.
    if: >-
      (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event_name != 'pull_request_target'
      && github.event.action != 'closed'
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # to check out the repo
    outputs:
      run: ${{ steps.plan.outputs.run }}
      visibility: ${{ steps.plan.outputs.visibility }}
      install-outcome: ${{ steps.install.outcome }}
      build-outcome: ${{ steps.build.outcome }}
      check-status: ${{ steps.check-result.outputs.status }}
      check-tail: ${{ steps.check-result.outputs.tail }}
      # Named per attempt, so a full re-run can upload again. Re-running only the
      # failed jobs reuses this output and the artifact from the first attempt.
      artifact: pr-preview-${{ steps.plan.outputs.worker }}-${{ github.run_attempt }}
    steps:
      - name: Check which pr-preview is running
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub didn't report which pr-preview commit is running (job.workflow_repository and job.workflow_sha), so pr-preview stops here. GitHub Enterprise Server doesn't provide them."
            exit 1
          fi

      - name: Check out pr-preview
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tool
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Plan
        id: plan
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          IN_WORKER_NAME: ${{ inputs.worker-name }}
          IN_WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          IN_ACCESS_TEAM_DOMAIN: ${{ inputs.access-team-domain }}
          IN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          IN_D1: ${{ inputs.d1 }}
          IN_PREVIEW_VARS: ${{ inputs.preview-vars }}
          IN_FORCE_PRIVATE: ${{ inputs.force-private }}
        run: node tool/scripts/plan.mjs

      - name: Check out the repo
        # pull_request_target runs have the repo's secrets, so they never check out a
        # pull request. This job doesn't run for them; this is a second guard.
        if: steps.plan.outputs.build == 'true' && github.event_name != 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.plan.outputs.sha }}
          path: app
          persist-credentials: false

      - name: Install
        id: install
        if: steps.plan.outputs.build == 'true'
        working-directory: ${{ steps.plan.outputs.app-dir }}
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: eval "$INSTALL_COMMAND"

      - name: Build
        id: build
        if: steps.plan.outputs.build == 'true'
        working-directory: ${{ steps.plan.outputs.app-dir }}
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: eval "$BUILD_COMMAND"

      - name: Check
        id: check
        if: steps.plan.outputs.build == 'true' && inputs.check-command != ''
        continue-on-error: true
        timeout-minutes: ${{ inputs.check-timeout-minutes }}
        working-directory: ${{ steps.plan.outputs.app-dir }}
        env:
          CHECK_COMMAND: ${{ inputs.check-command }}
          CHECK_LOG: ${{ runner.temp }}/pr-preview-check.log
        run: eval "$CHECK_COMMAND" 2>&1 | tee "$CHECK_LOG"

      - name: Summarize the check
        id: check-result
        if: always() && steps.check.outcome != '' && steps.check.outcome != 'skipped'
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          CHECK_LOG: ${{ runner.temp }}/pr-preview-check.log
        run: node tool/scripts/check-result.mjs

      - name: Collect the build output
        if: steps.plan.outputs.build == 'true'
        env:
          APP_DIR: ${{ steps.plan.outputs.app-dir }}
          IN_WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          IN_D1: ${{ inputs.d1 }}
          BUNDLE_DIR: ${{ runner.temp }}/pr-preview-bundle
        run: node tool/scripts/bundle.mjs

      - name: Hand the build output to the publish job
        if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-preview-${{ steps.plan.outputs.worker }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-preview-bundle
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Publish
    needs: build
    # Runs after a failed build too, to say so on the PR, and on its own when a
    # pull request closes. Not for runs that were cancelled or superseded, nor
    # for forks and Dependabot.
    if: >-
      !cancelled()
      && (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && (needs.build.outputs.run == 'true' || github.event_name == 'pull_request_target' || github.event.action == 'closed')
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 25
    permissions:
      contents: read # to check out pr-preview and read the branch head
      pull-requests: write # to post the preview comment, and to skip the upload when a newer commit is on the PR
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployment-id: ${{ steps.deploy.outputs.deployment-id }}
      visibility: ${{ steps.plan.outputs.visibility }}
    steps:
      - name: Check which pr-preview is running
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$WORKFLOW_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || ! "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub didn't report which pr-preview commit is running (job.workflow_repository and job.workflow_sha), so pr-preview stops here. GitHub Enterprise Server doesn't provide them."
            exit 1
          fi

      - name: Check out pr-preview
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tool
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # Plans again from the event rather than taking the build job's word, so
      # nothing from the job that ran the repo's code picks the Worker, the
      # preview or its visibility.
      - name: Plan
        id: plan
        env:
          HAS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          IN_WORKER_NAME: ${{ inputs.worker-name }}
          IN_WRANGLER_CONFIG: ${{ inputs.wrangler-config }}
          IN_ACCESS_TEAM_DOMAIN: ${{ inputs.access-team-domain }}
          IN_WORKING_DIRECTORY: ${{ inputs.working-directory }}
          IN_D1: ${{ inputs.d1 }}
          IN_PREVIEW_VARS: ${{ inputs.preview-vars }}
          IN_FORCE_PRIVATE: ${{ inputs.force-private }}
        run: node tool/scripts/plan.mjs

      - name: Install Wrangler
        id: wrangler
        if: steps.plan.outputs.build == 'true' && needs.build.result == 'success'
        working-directory: tool
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check for a newer commit
        id: fresh
        if: steps.wrangler.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_SHA: ${{ steps.plan.outputs.sha }}
          PLAN_PR_NUMBER: ${{ steps.plan.outputs.pr-number }}
          PLAN_DEFAULT_BRANCH: ${{ steps.plan.outputs.default-branch }}
        run: node tool/scripts/fresh.mjs

      - name: Download the build output
        id: download
        if: steps.fresh.outputs.fresh == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/pr-preview-bundle

      - name: Deploy
        id: deploy
        if: steps.fresh.outputs.fresh == 'true'
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLAN_VISIBILITY: ${{ steps.plan.outputs.visibility }}
          PLAN_WORKER: ${{ steps.plan.outputs.worker }}
          PLAN_ALIAS: ${{ steps.plan.outputs.alias }}
          PLAN_MAIN_ALIAS: ${{ steps.plan.outputs.main-alias }}
          PLAN_SHA: ${{ steps.plan.outputs.sha }}
          PLAN_PR_NUMBER: ${{ steps.plan.outputs.pr-number }}
          PLAN_TEAM_DOMAIN: ${{ steps.plan.outputs.team-domain }}
          IN_D1: ${{ inputs.d1 }}
          IN_PREVIEW_VARS: ${{ inputs.preview-vars }}
          BUNDLE_DIR: ${{ runner.temp }}/pr-preview-bundle
        run: node tool/scripts/deploy.mjs

      - name: Delete the preview
        id: cleanup
        if: steps.plan.outputs.cleanup == 'true'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PLAN_WORKER: ${{ steps.plan.outputs.worker }}
          PLAN_ALIAS: ${{ steps.plan.outputs.alias }}
        run: node tool/scripts/cleanup.mjs

      # Runs after a failed upload or deletion too, which still fail the job.
      - name: Comment on the pull request
        if: ${{ !cancelled() && steps.plan.outputs.run == 'true' }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOL_REPOSITORY: ${{ job.workflow_repository }}
          IN_WORKER_NAME: ${{ inputs.worker-name }}
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
          PLAN_MESSAGE: ${{ steps.plan.outputs.message }}
          PLAN_CONFIGURED: ${{ steps.plan.outputs.configured }}
          PLAN_MISSING: ${{ steps.plan.outputs.missing }}
          PLAN_VISIBILITY: ${{ steps.plan.outputs.visibility }}
          PLAN_SHA: ${{ steps.plan.outputs.sha }}
          PLAN_PR_NUMBER: ${{ steps.plan.outputs.pr-number }}
          BUILD_RESULT: ${{ needs.build.result }}
          INSTALL_OUTCOME: ${{ needs.build.outputs.install-outcome }}
          BUILD_OUTCOME: ${{ needs.build.outputs.build-outcome }}
          CHECK_COMMAND: ${{ inputs.check-command }}
          CHECK_STATUS: ${{ needs.build.outputs.check-status }}
          CHECK_TAIL: ${{ needs.build.outputs.check-tail }}
          # The upload failed if any of its steps did.
          DEPLOY_RESULT: >-
            ${{ (steps.wrangler.outcome == 'failure' || steps.fresh.outcome == 'failure' || steps.download.outcome == 'failure' || steps.deploy.outcome == 'failure')
            && 'failure' || steps.deploy.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy.outputs.status || steps.fresh.outputs.status }}
          DEPLOY_MESSAGE: ${{ steps.deploy.outputs.message || steps.fresh.outputs.message }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          DEPLOY_MAIN_URL: ${{ steps.deploy.outputs.main-url }}
          PLAN_CLEANUP: ${{ steps.plan.outputs.cleanup }}
          CLEANUP_RESULT: ${{ steps.cleanup.outcome }}
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.status }}
          CLEANUP_MESSAGE: ${{ steps.cleanup.outputs.message }}
        run: node tool/scripts/report.mjs
